name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uvx ruff check packages/ plugins/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e "packages/h5ad-obs[test]" -e "packages/obs-column-eval[test]" -e "packages/paper-access[test]"
      # Live tests are excluded by the package's addopts: they read a real remote
      # h5ad. The offline suite still covers the whole range-read path, against a
      # localhost server that honours Range.
      - run: uv run pytest packages/h5ad-obs -q
      - run: uv run pytest packages/obs-column-eval -q
      # No network: every rung is exercised through an httpx MockTransport.
      - run: uv run pytest packages/paper-access -q
      # The eval *cases* drive a real agent and are not in CI. Their graders are
      # pure functions and are: a rejection check that fails a correct answer
      # makes a green suite meaningless.
      - run: uv run pytest evals -q
      # The plugin hooks, invoked as subprocesses the way the harness calls them.
      - run: uv run pytest tests -q

  install-from-git:
    # The published contract: what a user gets from a SKILL.md command.
    #
    # Runs on pull requests as well as main, deliberately. Gating it to main
    # meant a packaging fault — a file never committed, a missing
    # package-data entry, a broken entry point — was only discovered after
    # merge, which is the one moment it cannot be fixed cheaply.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      # On a pull request github.sha is a synthetic merge commit. Pin to the
      # branch head instead, so what is tested is what was pushed.
      - id: rev
        run: |
          echo "sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - run: |
          uvx --from "git+https://github.com/${{ github.repository }}@${{ steps.rev.outputs.sha }}#subdirectory=packages/h5ad-obs" \
            h5ad-obs --version
      - run: |
          uvx --from "git+https://github.com/${{ github.repository }}@${{ steps.rev.outputs.sha }}#subdirectory=packages/obs-column-eval" \
            obs-column-eval --version
      - run: |
          uvx --from "git+https://github.com/${{ github.repository }}@${{ steps.rev.outputs.sha }}#subdirectory=packages/paper-access" \
            paper-access --version

  skill-pins-resolve:
    # Every `uvx --from git+…@<tag>` line a SKILL.md tells a user to run, run
    # as written. A pin to a tag that does not exist yet fails for everyone
    # except the author, whose uv cache already holds the package — so this is
    # not covered by anything above, and it is how a release breaks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Resolve every pin in every skill and hook
        run: |
          set -uo pipefail
          pins=$(grep -rhoE 'git\+https://github\.com/[^"]+#subdirectory=packages/[a-z0-9-]+' \
                   plugins/ | sort -u)
          if [ -z "$pins" ]; then
            echo "no pins found, which means this grep is wrong rather than the repo"
            exit 1
          fi
          status=0
          while read -r pin; do
            # Every package's console script is named after its directory, and
            # every CLI here supports --version. So the check is the user's own
            # command, not an approximation of it.
            cli=${pin##*subdirectory=packages/}
            echo "::group::$cli  $pin"
            if uvx --from "$pin" "$cli" --version; then
              echo "resolves"
            else
              echo "DOES NOT RESOLVE. Either the tag was never pushed, or the"
              echo "subdirectory is wrong. A user running this command gets the"
              echo "same failure; the author does not, because their uv cache"
              echo "already holds the package."
              status=1
            fi
            echo "::endgroup::"
          done <<< "$pins"
          exit $status
