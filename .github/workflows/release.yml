name: release

# Cut a tag, and a GitHub Release, for every plugin or package whose version on
# main has no tag yet. Runs only after `test` has passed on that exact commit,
# so a tag always names a reviewed, green commit on main -- never a branch, and
# never something cut by hand from a laptop.
#
# A manual run (`gh workflow run release.yml`, to retry a failed one) is held to
# the same rule: main only, and only once `test` has passed on that commit.
#
# Packages are tagged before plugins: a plugin in the same push may pin them,
# and its pins are checked against the freshly pushed tags before it is tagged.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read   # a manual run checks that `test` passed

# -eo pipefail, not the bare `bash -e` a step gets by default: a crash on the
# left of a pipe must fail the step, not read as "nothing to release".
defaults:
  run:
    shell: bash

jobs:
  release:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: A manual run needs test to have passed on this commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow test.yml --commit "$SHA" \
                --event push --status success --json databaseId -q length)
          if [ "$n" -eq 0 ]; then
            echo "::error::test has not passed on $SHA. Wait for it, or fix it, then re-run."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: plan
        run: |
          python3 scripts/versions.py untagged | tee untagged.tsv
          [ -s untagged.tsv ] || echo "Nothing to release." >> "$GITHUB_STEP_SUMMARY"

      - name: Tag packages
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r kind name version tag path; do
            [ -n "$tag" ] || continue
            [ "$kind" = package ] || continue
            # Cold-cache install of the commit the tag will name, before the tag
            # exists: a pushed tag is public, and a broken one costs a version.
            uvx --from "git+https://github.com/${{ github.repository }}@$SHA#subdirectory=$path" \
              "$(python3 scripts/versions.py cli "$name")" --version
            git tag -a "$tag" -m "$name $version" "$SHA"
            git push origin "$tag"
            echo "released $tag" >> "$GITHUB_STEP_SUMMARY"
          done < untagged.tsv

      - name: Check plugin pins resolve before tagging plugins
        run: |
          set -euo pipefail
          ref_of() { local r=${1%%#*}; echo "${r##*@}"; }
          python3 scripts/versions.py pins --tags 0 | cut -f1 | while read -r pin; do
            uvx --from "$pin" "$(python3 scripts/versions.py cli "${pin##*subdirectory=packages/}" --at "$(ref_of "$pin")")" --version
          done

      - name: Tag plugins
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r kind name version tag path; do
            [ -n "$tag" ] || continue
            [ "$kind" = plugin ] || continue
            # The CLI's own tagger: it validates the plugin and refuses when
            # plugin.json and the marketplace entry disagree.
            claude plugin tag "$path" --push
            echo "released $tag" >> "$GITHUB_STEP_SUMMARY"
          done < untagged.tsv

      - name: GitHub Releases
        run: |
          set -euo pipefail
          # Every current version, not just this run's tags: a tag pushed by an
          # earlier run that failed before this step still gets its Release.
          python3 scripts/versions.py current > "$RUNNER_TEMP/current.tsv"
          while IFS=$'\t' read -r kind name version tag path; do
            [ -n "$tag" ] || continue
            git rev-parse -q --verify "refs/tags/$tag" > /dev/null || continue
            if gh release view "$tag" > /dev/null 2>&1; then continue; fi
            prefix=${tag%"$version"}
            prev=$(git tag --list "${prefix}*" --sort=-v:refname | grep -vx "$tag" | head -1 || true)
            {
              if [ "$kind" = plugin ]; then
                # A plugin entry for a project's own marketplace.json, not a `ref`
                # on this marketplace: Claude Code keeps one registration per
                # marketplace name per machine, so a ref there pins every project
                # on the machine to whichever registered last.
                echo "Install this exact release: add this entry to the \`plugins\` list"
                echo "of your project's own \`.claude-plugin/marketplace.json\`:"
                echo
                echo '```json'
                echo "{ \"name\": \"$name\", \"source\": { \"source\": \"git-subdir\","
                echo "  \"url\": \"https://github.com/${{ github.repository }}.git\","
                echo "  \"path\": \"$path\", \"ref\": \"$tag\" } }"
                echo '```'
                echo
                echo "Package pins in this release:"
                echo
                git grep -hoE 'pkg-[a-z0-9-]+--v[0-9][^#"]*' "$tag" -- "$path" | sort -u | sed 's/^/- /' || echo "- none"
                echo
              fi
              echo "Changes under \`$path\` since ${prev:-the start}:"
              echo
              git log --format='- %s (%h)' ${prev:+"$prev.."}"$tag" -- "$path"
            } > notes.md
            # --latest=false: GitHub allows one "Latest" release per repo, which
            # means nothing when every plugin and package has its own version line.
            gh release create "$tag" --verify-tag --latest=false \
              --title "$name $version" --notes-file notes.md
            echo "wrote the GitHub Release for $tag" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/current.tsv"
