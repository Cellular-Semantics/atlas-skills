[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-column-eval"
version = "0.4.0"
description = "Gold set and metrics for scoring author cell-type obs column picks against CL_KG curation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Cellular Semantics" }]
keywords = ["single-cell", "cell-annotation", "evaluation", "cellxgene"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Deliberately none. The gold set is CSV and JSON, the metrics are arithmetic,
# and an eval that cannot be installed anywhere does not get run.
dependencies = []

[project.optional-dependencies]
# `check-picks` only: the schema needs jsonschema, and a parquet source needs
# pyarrow for its schema. Opt-in, so scoring stays installable anywhere -- the
# author-annotation-columns hook installs this extra, nothing else does.
check = ["jsonschema~=4.26.0", "pyarrow~=26.0.0"]
test = ["pytest>=8", "jsonschema~=4.26.0", "pyarrow~=26.0.0"]

[project.urls]
Homepage = "https://github.com/Cellular-Semantics/atlas-skills"
Repository = "https://github.com/Cellular-Semantics/atlas-skills"

[project.scripts]
obs-column-eval = "obs_column_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_column_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
