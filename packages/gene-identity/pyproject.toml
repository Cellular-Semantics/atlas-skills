[project]
name = "gene-identity"
version = "0.3.1"
description = "Look up which NCBI genes claim a gene or protein name, through Translator Name Resolver or an offline gene table. Returns the claimants; never picks among them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cellular Semantics" }]
# The lookup itself is standard library only: the two Translator services are
# plain JSON over HTTPS. jsonschema validates the skill's records. Patch
# releases only: `uvx` resolves fresh on every cold cache and ignores uv.lock.
dependencies = [
    "jsonschema~=4.26.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
# `gene-id` is what the skill types. `gene-identity` matches the package
# directory, which is the name the repo's pin check invokes.
gene-id = "gene_identity.cli:main"
gene-identity = "gene_identity.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gene_identity = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real Translator service; deselected by default",
]
addopts = "-m 'not live'"
