[project]
name = "paper-access"
version = "0.3.1"
description = "Retrieve the text of a list of papers and record honestly what arrived: JATS XML, an ASTA index probe, an open-access PDF, or an ask."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cellular Semantics" }]
dependencies = [
    # Patch releases only: `uvx` resolves fresh on every cold cache and ignores
    # uv.lock, so these ranges are what holds a released tag to what was tested.
    "httpx~=0.28.1",
    "jsonschema~=4.26.0",
]

[project.optional-dependencies]
# Getting past hosts that fingerprint the client, and reading PDFs. Separate
# from the base install because a caller who only wants Europe PMC's XML should
# not have to build PyMuPDF to get it.
text-access = [
    "curl-cffi~=0.17.0",
    "pymupdf4llm~=1.28.2",  # 2.0 is an empty shim: the code moved into pymupdf 2.x
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
paper-access = "paper_access.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_access = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real API; deselected by default",
]
addopts = "-m 'not live'"
