[project]
name = "ontomap"
version = "0.1.0"
description = "Map author-recorded species, sex, developmental stage, disease and tissue strings onto ontology terms, refusing rather than guessing, with every structural claim checked."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cellular Semantics" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Reading sample tables that are not CSV. A caller feeding in CSV needs none of it.
tables = [
    "pandas>=2.0",
    "pyarrow>=15.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
ontomap = "ontomap.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ontomap = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits Ubergraph or OLS for real; deselected by default",
]
addopts = "-m 'not live'"
